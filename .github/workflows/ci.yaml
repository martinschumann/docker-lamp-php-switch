name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    name: Build and run (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    env:
      PHP_VERSION: ${{ matrix.php }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create temporary .env file
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          echo "PHP_VERSION=$PHP_VERSION" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yaml
          targets: apache,mariadb,php-fpm
          load: true
          set: |
            apache.args.PHP_VERSION=8.4
            apache.cache-from=type=gha,scope=lamp-apache
            apache.cache-to=type=gha,scope=lamp-apache,mode=max
            mariadb.cache-from=type=gha,scope=lamp-mariadb
            mariadb.cache-to=type=gha,scope=lamp-mariadb,mode=max

      - name: Configure local DNS routing
        run: |
          echo '127.0.0.1 examplehost.lamp.localhost' | sudo tee -a /etc/hosts

      - name: Start stack from built images
        run: docker compose up -d --no-build --pull never apache mariadb php-fpm

      - name: Test Apache default page over HTTP
        if: ${{ matrix.php == '8.2' }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 \
            http://127.0.0.1/ \
            | grep -F 'Apache2 Ubuntu Default Page' > /dev/null

      - name: Wait for and import Root CA
        run: |
          make wait-for-root-ca
          sudo install -m 0644 pki/ca/root-ca.lamp-php-switch.crt \
            /usr/local/share/ca-certificates/root-ca.lamp-php-switch.crt
          sudo update-ca-certificates

      - name: Verify PHP version in the ubuntu login shell
        run: |
          output=$(docker compose exec -T --user ubuntu php-fpm bash -lc 'php -v')
          echo "$output"
          version=$(sed -En '1s/^PHP ([0-9]+[.][0-9]+)[.].*/\1/p' <<< "$output")

          if [[ "$version" != "${PHP_VERSION}" ]]; then
            echo "Expected PHP CLI version $PHP_VERSION but found ${version:-unknown}" >&2
            exit 1
          fi

      - name: Verify PHP version over HTTPS
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 \
            https://examplehost.lamp.localhost/)"

          if ! grep -Fq "PHP Version ${PHP_VERSION}." <<< "$response"; then
            echo "Expected PHP ${PHP_VERSION}.x in the HTTPS response" >&2
            exit 1
          fi

      - name: Shutdown LAMP Stack
        if: always()
        run: make down
