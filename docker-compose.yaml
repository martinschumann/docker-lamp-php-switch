name: lamp-php-switch

networks:
  internal-net:
    name: internal-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.1.0/24

volumes:
  mariadb-data-dir:
  mariadb-sockets-dir:
  postgres-data-dir:
  fpm-sockets-dir:

services:
  pki:
    image: martinschumann/docker-lamp-php-switch-pki:latest
    build:
      context: .
      dockerfile: ./pki/Dockerfile
    scale: 0

  apache:
    image: martinschumann/docker-lamp-php-switch-apache:latest
    build:
      context: .
      dockerfile: ./apache/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
      additional_contexts:
        martinschumann/docker-lamp-php-switch-pki: service:pki
    environment:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      RENEW_SSL_CA: ${RENEW_SSL_CA:-0}
    container_name: apache
    hostname: apache
    networks:
      internal-net:
        ipv4_address: 172.16.1.10
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      # Bind Mounts
      - ./pki/ca:/docker/ca
      - ./vhosts:/srv/apache2/vhosts
      - ./vhosts-configs:/etc/apache2/php-fpm-sites
      # Named volumes
      - fpm-sockets-dir:/run/php

  php-fpm:
    image: martinschumann/docker-lamp-php-switch-php-fpm:${PHP_VERSION:-8.4}
    build: 
      context: .
      dockerfile: ./php-fpm/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    environment:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    container_name: php-fpm-${PHP_VERSION:-8.4}
    hostname: php-fpm-${PHP_VERSION:-8.4}
    networks:
      internal-net:
        ipv4_address: 172.16.1.11
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Bind mounts
      - ./shell/ubuntu/.bashrc.d:/home/ubuntu/.bashrc.d
      - ./shell/ubuntu/.config:/home/ubuntu/.config
      - ./shell/ubuntu/files:/home/ubuntu/.host-data
      - ./shell/ubuntu/.mysql:/home/ubuntu/.mysql
      - ./shell/ubuntu/.ssh:/home/ubuntu/.ssh
      - ./vhosts:/srv/apache2/vhosts
      # Named volumes
      - fpm-sockets-dir:/run/php
      - mariadb-sockets-dir:/run/mysqld

  mariadb:
    image: martinschumann/docker-lamp-php-switch-mariadb:latest
    build:
      context: .
      dockerfile: ./mariadb/Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/credentials/mariadb_root_pwd
    container_name: mariadb
    hostname: mariadb
    command: ["--ssl=0"]
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      internal-net:
        ipv4_address: 172.16.1.12
    volumes:
      # Bind mounts
      - ./credentials:/run/credentials
      # Named volumes
      - mariadb-data-dir:/var/lib/mysql
      - mariadb-sockets-dir:/run/mysqld
