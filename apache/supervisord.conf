[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root

[program:apache2]
command=/usr/sbin/apache2 -DFOREGROUND
autostart=true
autorestart=true
startretries=999
exitcodes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:config_monitor]
directory=/etc/apache2
command=watchmedo shell-command --drop --patterns="*.conf" --recursive --command='bash -c "
    source /docker/lib/utils.sh
    log \"Apache config has changed, testing ...\"
    if apachectl configtest; then
        log \"Config test: OK\"
        log \"Restarting Apache via Supervisor\"
        supervisorctl restart apache2
    else
        log \"Cryptic or broken configuration. Skip restart.\" \"ERROR\"
    fi
  "' php-fpm-sites
user=root
autostart=true
autorestart=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
