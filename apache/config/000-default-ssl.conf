<VirtualHost *:443>
    ServerName default.lamp.localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/wildcard.lamp.localhost.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/wildcard.lamp.localhost.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # SSLCipherSuite HIGH:!aNULL:!MD5
    # SSLHonorCipherOrder on
    # Header always set Strict-Transport-Security "max-age=31536000"

    # ErrorLog ${APACHE_LOG_DIR}/default-ssl-error.log
    # CustomLog ${APACHE_LOG_DIR}/default-ssl-access.log combined

    <Directory /var/www/html>
        Require all granted
        AllowOverride All
    </Directory>
</VirtualHost>
