<VirtualHost *:443>
    ServerName default.lamp.localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile      "/opt/pki/certs/server.lamp-php-switch.crt"
    SSLCertificateKeyFile   "/opt/pki/private/server.lamp-php-switch.key"
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/html>
        Require all granted
        AllowOverride All
    </Directory>
</VirtualHost>
